services:
  api:
    build: ./apps/api
    ports: ["127.0.0.1:18080:8000"]
    env_file:
      - .env
      - path: apps/api/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      VISION_URL: http://vision:8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./apps/api
    command: celery -A pulse_api.tasks.celery_app worker --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      VISION_URL: http://vision:8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ./apps/api
    command: celery -A pulse_api.tasks.celery_app beat --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      VISION_URL: http://vision:8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports: ["127.0.0.1:13000:3000"]

  # Marketing site served at the root of the app host (see deploy/nginx/pulse.racoai.io.conf).
  landing:
    build: ./apps/landing
    restart: unless-stopped
    ports: ["127.0.0.1:13001:3000"]

  # Product photo matching (Unicom ViT-B/32 on CPU). Internal only: no published port.
  # Model files (~0.5 GB) download once into the vision_models volume on first start.
  vision:
    build: ./apps/vision
    environment:
      VISION_THREADS: "2"
    volumes: [vision_models:/models]
    cpus: 2
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['ok'] else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # An unclean host shutdown can tear the AOF tail and leave Redis crash-looping,
    # which silently stops every Celery job. Repair (or set aside) a bad AOF before start;
    # Postgres stays authoritative and beat re-dispatches pending work.
    entrypoint: ["/bin/sh", "/usr/local/bin/pulse-redis-start.sh"]
    configs:
      - source: redis_start
        target: /usr/local/bin/pulse-redis-start.sh
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis_data:
  vision_models:

configs:
  redis_start:
    content: |
      #!/bin/sh
      manifest=/data/appendonlydir/appendonly.aof.manifest
      if [ -f "$$manifest" ] && ! redis-check-aof "$$manifest" >/dev/null 2>&1; then
        echo "pulse: AOF failed check, attempting repair"
        echo y | redis-check-aof --fix "$$manifest" || true
        if ! redis-check-aof "$$manifest" >/dev/null 2>&1; then
          aside="/data/appendonlydir.corrupt-$$(date +%Y%m%d%H%M%S)"
          echo "pulse: AOF unrecoverable, moving to $$aside"
          mv /data/appendonlydir "$$aside"
        fi
      fi
      exec docker-entrypoint.sh redis-server --appendonly yes
